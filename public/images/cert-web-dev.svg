<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="14" fill="#0f1118"/>
  <rect x="2" y="2" width="596" height="396" rx="12" stroke="#252a3d" stroke-width="2"/>
  <circle cx="300" cy="180" r="180" fill="#6366f1" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Outer border ornament -->
  <rect x="25" y="25" width="550" height="350" rx="8" fill="none" stroke="#2c334b" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- Seal / Badge -->
  <circle cx="300" cy="100" r="36" fill="#181d2c" stroke="#6366f1" stroke-width="2"/>
  <path d="M 285 100 L 295 110 L 315 88" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="300" y="170" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">CERTIFICATE OF RECOGNITION</text>
  <text x="300" y="200" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" text-anchor="middle">Pengembangan Aplikasi Web Modern &amp; Frontend Architecture</text>
  <line x1="200" y1="225" x2="400" y2="225" stroke="#333d59" stroke-width="1"/>
  
  <text x="300" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Diberikan sebagai bukti kompetensi rekayasa perangkat lunak web</text>
  <text x="300" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">dan penguasaan teknologi ekosistem React &amp; TypeScript</text>
  
  <!-- Signatures footer -->
  <g transform="translate(100, 310)">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#475569" stroke-width="1"/>
    <text x="60" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Verifikasi Instruktur</text>
  </g>
  <g transform="translate(380, 310)">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#475569" stroke-width="1"/>
    <text x="60" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">ID Sertifikasi: KT-2024</text>
  </g>
