<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0d0c12"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#251f33" stroke-width="2"/>
  
  <circle cx="400" cy="250" r="280" fill="#a855f7" opacity="0.1" filter="blur(60px)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="12" fill="#14111f" stroke="#2b233d" stroke-width="1.5"/>
    <rect width="680" height="40" rx="12" fill="#1b172a"/>
    <path d="M 0 28 L 680 28" stroke="#251f33" stroke-width="1"/>
    
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="20" r="5" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="12" width="220" height="16" rx="8" fill="#0d0c12"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">creative-hub.design</text>

    <!-- Editorial Typography Experiment -->
    <text x="40" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#e9d5ff">MINIMALIST HUB</text>
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7">EXPLORING ASYMMETRICAL EDITORIAL GRID</text>

    <!-- Masonry items -->
    <rect x="40" y="140" width="180" height="200" rx="8" fill="#1f1a2e" stroke="#3b2f56"/>
    <text x="60" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f3e8ff">Item 01 / Bold</text>
    <rect x="60" y="190" width="140" height="120" rx="4" fill="#2d2442"/>

    <rect x="240" y="140" width="230" height="110" rx="8" fill="#1f1a2e" stroke="#3b2f56"/>
    <text x="260" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f3e8ff">Item 02 / Frame</text>
    <rect x="260" y="185" width="190" height="40" rx="4" fill="#2d2442"/>

    <rect x="240" y="265" width="230" height="75" rx="8" fill="#1f1a2e" stroke="#3b2f56"/>
    <text x="260" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">Item 03 / Typography</text>

    <rect x="490" y="140" width="150" height="200" rx="8" fill="#1f1a2e" stroke="#3b2f56"/>
    <text x="510" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f3e8ff">Item 04 / Media</text>
    <circle cx="565" cy="240" r="35" fill="#581c87" stroke="#a855f7"/>
  </g>
</svg>
