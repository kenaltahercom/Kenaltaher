<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0d0e14"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#232332" stroke-width="2"/>
  
  <!-- Subtle Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161722" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.6"/>

  <!-- Radial highlight -->
  <circle cx="400" cy="250" r="280" fill="#6366f1" opacity="0.12" filter="blur(60px)"/>

  <!-- Mockup Window Browser Frame -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="12" fill="#12131b" stroke="#2a2a3c" stroke-width="1.5"/>
    <!-- Browser Top Bar -->
    <rect width="680" height="40" rx="12" fill="#181924"/>
    <path d="M 0 28 L 680 28" stroke="#232332" stroke-width="1"/>
    <!-- Window buttons -->
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="20" r="5" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="12" width="260" height="16" rx="8" fill="#0d0e14"/>
    <text x="130" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">kenaltaher.vercel.app</text>

    <!-- Content Body Mockup -->
    <!-- Editorial Headline Mockup -->
    <text x="50" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#818cf8">FEATURED PORTFOLIO</text>
    <text x="50" y="145" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-1" fill="#f8fafc">KENALTAHER</text>
    <text x="50" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Bespoke Digital Solutions & Web Engineering</text>

    <!-- Mini Cards Inside Mockup -->
    <g transform="translate(50, 220)">
      <rect width="170" height="120" rx="8" fill="#1c1d2a" stroke="#2f3045"/>
      <rect x="20" y="20" width="80" height="10" rx="4" fill="#6366f1"/>
      <rect x="20" y="42" width="130" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="56" width="100" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="85" width="60" height="18" rx="4" fill="#26273b"/>
    </g>
    <g transform="translate(240, 220)">
      <rect width="170" height="120" rx="8" fill="#1c1d2a" stroke="#2f3045"/>
      <rect x="20" y="20" width="70" height="10" rx="4" fill="#38bdf8"/>
      <rect x="20" y="42" width="130" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="56" width="110" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="85" width="60" height="18" rx="4" fill="#26273b"/>
    </g>
    <g transform="translate(430, 220)">
      <rect width="200" height="120" rx="8" fill="#181926" stroke="#2f3045"/>
      <circle cx="50" cy="60" r="24" fill="#232438" stroke="#6366f1" stroke-width="1.5"/>
      <!-- Small Mascot silhouette -->
      <path d="M 44 48 L 44 72 M 44 60 L 56 48 M 44 60 L 56 72" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text x="90" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Mascot</text>
      <text x="90" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Identity Visual</text>
    </g>
  </g>
</svg>
