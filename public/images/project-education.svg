<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0c0e12"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#1c222b" stroke-width="2"/>
  
  <circle cx="380" cy="240" r="250" fill="#10b981" opacity="0.1" filter="blur(60px)"/>

  <g transform="translate(60, 50)">
