<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background glow gradient -->
    <radialGradient id="kGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <!-- Main Body Gradient -->
    <linearGradient id="bodyGrad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f202b"/>
      <stop offset="50%" stop-color="#15151c"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <!-- Accent Neon Indigo to Cyan -->
    <linearGradient id="neonAccent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Eye Glow -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Mascot -->
  <circle cx="120" cy="120" r="105" fill="url(#kGlow)"/>

  <!-- Character Silhouette: Stylized Futuristic Friendly 'K' Structure -->
  <!-- Left Vertical Spine of K with Rounded Soft Edges -->
  <rect x="48" y="44" width="38" height="152" rx="19" fill="url(#bodyGrad)" stroke="#313244" stroke-width="2.5"/>
  <rect x="52" y="48" width="30" height="144" rx="15" stroke="url(#neonAccent)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Diagonal Arm of K -->
  <path d="M78 122 L160 52 C168 45 180 48 184 57 C188 66 185 77 176 84 L108 140 Z" fill="url(#bodyGrad)" stroke="#313244" stroke-width="2.5"/>
  <path d="M86 120 L158 58 C163 53 172 55 175 62 C178 68 176 75 170 80 L108 132" stroke="url(#neonAccent)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Bottom Diagonal Leg of K -->
  <path d="M102 126 L175 188 C183 195 183 206 175 213 C166 220 154 219 146 211 L78 152 Z" fill="url(#bodyGrad)" stroke="#313244" stroke-width="2.5"/>
  <path d="M106 132 L168 186 C173 190 173 198 167 203 C161 208 153 207 148 202 L86 148" stroke="url(#neonAccent)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Head / Face Visor on the Spine -->
  <rect x="53" y="68" width="28" height="42" rx="14" fill="#0c0d12" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Friendly Glowing Eyes (Happy expression) -->
  <circle cx="67" cy="83" r="5" fill="#38bdf8" filter="url(#eyeGlow)"/>
  <circle cx="67" cy="97" r="5" fill="#38bdf8" filter="url(#eyeGlow)"/>
  <circle cx="69" cy="81" r="1.5" fill="#ffffff"/>
  <circle cx="69" cy="95" r="1.5" fill="#ffffff"/>

  <!-- Waving Friendly Hand / Orb on Upper Right Arm -->
  <circle cx="180" cy="56" r="14" fill="url(#neonAccent)"/>
  <circle cx="180" cy="56" r="8" fill="#ffffff" opacity="0.9" filter="url(#eyeGlow)"/>

  <!-- Sparkle Particle Star -->
  <path d="M195 35 Q195 45 205 45 Q195 45 195 55 Q195 45 185 45 Q195 45 195 35 Z" fill="#38bdf8" opacity="0.8"/>
  <circle cx="150" cy="30" r="2.5" fill="#a855f7" opacity="0.7"/>
  <circle cx="198" cy="85" r="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Floating Base Shadow -->
  <ellipse cx="120" cy="216" rx="55" ry="6" fill="#000000" opacity="0.6"/>
</svg>
